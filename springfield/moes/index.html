<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simpsons home gallery</title>
  <link rel="stylesheet" href="/styles.css"/>
  <link rel="stylesheet" href="/springfield/grid.css"/>
  <link rel="stylesheet" href="/springfield/gallery.css"/>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="/kuvat/The_Simpsons_yellow_logo.svg.png" alt="Logo" class="logo-img">
      <h1 class="site-title">Simpsons home</h1>
    </div>
    <div class="nav">
      <nav class="nav">
        <a href="/index.html">Main page</a>
        <a href="/springfield/index.html">Springfield</a>
        <a href="/hahmo/index.html">Characters</a>
        <a href="/keskustelu/index.html">Forum</a>
      </nav>
    </div>
    <main>
      <h2 style="font-style:italic; color:#1769B6; margin:24px 0 0 16px;">Simpsons home gallery</h2>
      <div class="gallery-grid">
        <img class="gallery-img" src="/kuvat/simpson_home1.jpg" alt="Simpsons home 1">
        <img class="gallery-img" src="/kuvat/simpson_home2.jpg" alt="Simpsons home 2">
        <img class="gallery-img" src="/kuvat/simpson_home3.jpg" alt="Simpsons home 3">
        <img class="gallery-img" src="/kuvat/simpson_home4.jpg" alt="Simpsons home 4">
        <img class="gallery-img" src="/kuvat/simpson_home5.jpg" alt="Simpsons home 5">
        <img class="gallery-img" src="/kuvat/simpson_home6.jpg" alt="Simpsons home 6">
      </div>
    </main>
    <div class="modal" id="modal">
      <div class="modal-content">
        <img id="modal-img" src="" alt="Gallery image">
        <button class="modal-close">Close</button>
      </div>
    </div>
  </div>
  <script src="/springfield/index.js"></script>
</body>
</html>
