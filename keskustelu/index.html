<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Forum</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../grid.css">
    <script src="index.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <img class="logo-img" src="../kuvat/The_Simpsons_yellow_logo.svg.png" alt="Simpsons logo">
            <h1 class="site-title">The Simpsons Page</h1>
        </div>

        <div class="nav">
            <nav>
                <a href="../springfield/index.html">Springfield</a>
                <a href="../hahmo/index.html">Characters</a>
                <a href="../keskustelu/index.html">Forum</a>
            </nav>
        </div>

        <div class="banner">
            <img class="banner-img" src="../kuvat/The Simpsons.jpg">
        </div>

        <div class="forum-container">
            <h1>Forum</h1>
            <button id="newMsgBtn">Write message</button>
            <div id="messages"></div>
        </div>

        <div class="dialog-bg" id="dialogBg">
            <div class="dialog">
                <h2>New Message</h2>
                <input type="text" id="sender" placeholder="Sender's Name">
                <input type="text" id="title" placeholder="Title">
                <textarea id="content" placeholder="Message Content"></textarea>
                <div class="dialog-buttons">
                <button id="sendBtn">Send</button>
                <button id="cancelBtn">Cancel</button>
            </div>
        </div>
    </div>

</body>
</html>
